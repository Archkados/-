<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проект ученика | Morrison Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .site { flex: 1; width: 100%; border: 0; background: #fff; }
    .credit {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 10px 16px; background: var(--ink); color: #fff;
    }
    .credit p { margin: 0; flex: 1 1 260px; font-size: 15px; color: #C6CEE4; }
    .credit p b { color: #fff; }
    .credit .btn-quiet { color: #fff; box-shadow: inset 0 0 0 2px var(--ink-3); }
    .credit .btn-quiet:hover { box-shadow: inset 0 0 0 2px #fff; }
    .credit a.btn { text-decoration: none; }
    .empty { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; }
    .empty h1 { font-size: 28px; margin-bottom: 12px; }
    .empty p { color: var(--muted); max-width: 44ch; margin: 0 auto 20px; }
    .empty a { text-decoration: none; }
    .code-tabs { display: flex; gap: 6px; margin: 14px 0 10px; }
    .code-tabs button { border: 0; border-radius: 10px; padding: 7px 14px; background: var(--paper); font: 600 14px var(--mono); cursor: pointer; }
    .code-tabs button.active { background: var(--ink); color: #fff; }
    .code-view {
      margin: 0; max-height: 60vh; overflow: auto; padding: 16px; border-radius: 14px;
      background: var(--ink-2); color: #E6EBF7; font: 14px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .modal-card .btn { margin-top: 16px; }
  </style>
</head>
<body>
  <iframe id="site" class="site" sandbox="allow-scripts allow-same-origin allow-modals" title="Проект ученика" hidden></iframe>

  <div id="credit" class="credit" hidden>
    <span class="brand-mark">M</span>
    <p><b id="author"></b> сделал(а) этот проект на пробном уроке Morrison Academy</p>
    <button id="codeBtn" class="btn btn-small btn-quiet" type="button">Посмотреть код</button>
    <a class="btn btn-small btn-sun" href="index.html">Сделать свой</a>
  </div>

  <div id="empty" class="empty" hidden>
    <div>
      <h1>Проект не открылся</h1>
      <p>Ссылка неполная или повреждена. Попроси автора скопировать её ещё раз на финальном экране урока.</p>
      <a class="btn btn-sun" href="index.html">Сделать свой проект</a>
    </div>
  </div>

  <div id="codeModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="codeTitle">
      <h2 id="codeTitle">Код проекта</h2>
      <div class="code-tabs">
        <button type="button" data-k="html" class="active">HTML</button>
        <button type="button" data-k="css">CSS</button>
        <button type="button" data-k="js">JS</button>
      </div>
      <pre id="codeView" class="code-view"></pre>
      <button id="closeCode" class="btn btn-quiet" type="button">Закрыть</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    (function () {
      var m = location.hash.match(/p=([^&]+)/);
      var p = null;
      try { if (m) p = MFS.decodeProject(m[1]); } catch (e) { p = null; }
      if (!p) {
        document.getElementById('empty').hidden = false;
        return;
      }
      document.title = (p.title || 'Мой проект') + ' | Morrison Academy';
      document.getElementById('author').textContent = p.name || 'Ученик';
      var site = document.getElementById('site');
      site.srcdoc = MFS.buildDocument(p, { mode: 'view' }).doc;
      site.hidden = false;
      document.getElementById('credit').hidden = false;

      var modal = document.getElementById('codeModal');
      var view = document.getElementById('codeView');
      var code = { html: p.html, css: p.css, js: p.js };
      function show(k) {
        view.textContent = code[k].trim() || '(пусто)';
        Array.prototype.forEach.call(document.querySelectorAll('.code-tabs button'), function (b) {
          b.classList.toggle('active', b.getAttribute('data-k') === k);
        });
      }
      document.querySelector('.code-tabs').addEventListener('click', function (e) {
        var k = e.target.getAttribute && e.target.getAttribute('data-k');
        if (k) show(k);
      });
      document.getElementById('codeBtn').addEventListener('click', function () { show('html'); modal.hidden = false; });
      document.getElementById('closeCode').addEventListener('click', function () { modal.hidden = true; });
      modal.addEventListener('click', function (e) { if (e.target === modal) modal.hidden = true; });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') modal.hidden = true; });
    })();
  </script>
</body>
</html>
